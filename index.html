<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI 标注助手 · Annotation Workbench</title>
<meta name="description" content="面向 UMR 等结构化标注任务的 AI 协作标注台：连接 Google Drive / GitHub，一步步用 skill 标注，语音输入，多人标注一致性合并。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>◧</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!--
  Visible by default; js/app.js removes it once boot() finishes. If the module
  never loads (opened over file://, a bad path, a syntax error) the page still
  renders this whole static layout and looks like a working app while nothing
  at all is wired up — every button silently does nothing. This banner is what
  turns that into a stated failure. The inline script is deliberately NOT a
  module, so it runs even when module loading is what is broken.
-->
<div id="boot-error" class="boot-error" role="alert">
  <strong>页面没有启动 · The app did not start</strong>
  <span id="boot-error-why"></span>
  <span class="boot-step-line">最后到达的步骤 · last step reached: <code id="boot-step">(js/app.js 还没开始跑 · js/app.js has not run yet)</code></span>
</div>
<script>
  (function () {
    var why = document.getElementById('boot-error-why');
    var say = function (text) { if (!why.dataset.locked) why.textContent = text; };
    var lock = function (text) { why.textContent = text; why.dataset.locked = '1'; };

    if (location.protocol === 'file:') {
      lock('你是用 file:// 直接打开的 HTML。浏览器会以 CORS 为由拒绝加载 ES 模块，'
        + '所以 js/ 下的代码一行都没跑 —— 界面是静态的，任何按钮（包括语言切换）都不会有反应。'
        + '请在仓库根目录起一个本地服务器：python3 -m http.server 8899，然后访问 http://localhost:8899/'
        + '  ·  Opened over file://, so the browser blocked the ES modules and no script ran. '
        + 'Serve the folder instead: python3 -m http.server 8899 then open http://localhost:8899/');
      return;
    }

    /**
     * Walk the module graph from js/app.js and report the first file the
     * server will not serve.
     *
     * The browser tells us "the module failed to load" but never WHICH import
     * failed — that only shows up in the console/network panel. So the page
     * finds out for itself: follow every relative `from '...'` and report any
     * non-200. One missing file is the single most likely cause of a graph
     * that will not load, and naming it is the whole answer.
     */
    function probeGraph() {
      var seen = {}, queue = ['js/app.js'], bad = [], checked = 0;
      function step() {
        if (!queue.length || checked > 80) return Promise.resolve(bad);
        var path = queue.shift();
        if (seen[path]) return step();
        seen[path] = 1; checked++;
        return fetch(path, { cache: 'no-store' }).then(function (r) {
          if (!r.ok) { bad.push(path + ' -> HTTP ' + r.status); return ''; }
          return r.text();
        }).catch(function (err) {
          bad.push(path + ' -> ' + (err && err.message)); return '';
        }).then(function (src) {
          var re = /from\s+['"](\.[^'"]+)['"]/g, m;
          var dir = path.slice(0, path.lastIndexOf('/'));
          while ((m = re.exec(src))) {
            var parts = (dir + '/' + m[1]).split('/'), out = [];
            for (var i = 0; i < parts.length; i++) {
              if (parts[i] === '.' || parts[i] === '') continue;
              if (parts[i] === '..') out.pop(); else out.push(parts[i]);
            }
            queue.push(out.join('/'));
          }
          return step();
        });
      }
      return step();
    }

    function reportGraph(prefix) {
      probeGraph().then(function (bad) {
        if (bad.length) {
          lock(prefix + ' 缺文件：' + bad.join('、') + '。请确认代码是完整的（git status / 重新 pull），'
            + '并强制刷新。  ·  Missing module(s): ' + bad.join(', ') + '. Check your checkout is complete and hard-refresh.');
        } else {
          lock(prefix + ' 所有模块文件都能取到（没有 404），所以是某个模块执行时报错了。'
            + '请打开控制台（F12）看第一条红色报错，把那一行发给我。'
            + '  ·  Every module file is reachable, so one of them threw while evaluating. '
            + 'Open the console (F12) and send me the first red error.');
        }
      });
    }

    // A module that 404s fails on its <script> element — but the element only
    // ever names the ENTRY file, never the import that actually broke, so go
    // and find the real one.
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') {
        lock('加载模块失败，正在查是哪一个…  ·  Module load failed, finding which one…');
        why.dataset.locked = '';           // let the graph probe replace this
        reportGraph('模块图加载失败 · module graph failed to load:');
      }
    }, true);

    // ...but a module that loads and then THROWS — a syntax error, a bad
    // import, an API the browser does not have — reports as an ordinary
    // uncaught error, which the listener above never sees. That was the gap:
    // the banner could only say "it never started", never why. Print the real
    // message, with the file and line, because that is the whole answer.
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') return;   // handled above
      if (!e.message) return;
      var at = e.filename ? (' @ ' + e.filename.replace(location.origin, '') + ':' + e.lineno + ':' + e.colno) : '';
      lock('模块报错 · module error:  ' + e.message + at);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      lock('未捕获的 Promise 错误 · unhandled rejection:  ' + ((r && (r.message || r)) || r));
    });

    // Report where it stopped, not merely that it stopped. A step name turns
    // "it did not finish" into something actionable: a fetch step means the
    // server or a file, a wiring step means the DOM.
    setTimeout(function () {
      var box = document.getElementById('boot-error');
      if (!box) return;
      // A real error already beat us to it — never talk over it with a guess.
      // (This ordering matters: the probe below ends in lock(), which would
      // otherwise overwrite the actual message with a vaguer one.)
      if (why.dataset.locked) return;
      var at = window.__bootStep;

      if (at && at.indexOf('fetch') !== -1) {
        say('卡在「' + at + '」—— 这一步在向本地服务器要文件。'
          + '请确认 python3 -m http.server 还活着、而且是在仓库根目录（能看到 index.html 和 js/ 的那一层）起的。'
          + '  ·  Stuck at "' + at + '", which is fetching from your local server. Check the server is still '
          + 'running and was started in the repository root.');
        return;
      }
      if (at) {
        say('卡在「' + at + '」。请打开控制台看具体报错。'
          + '  ·  Stuck at "' + at + '". Check the console for the actual error.');
        return;
      }

      // Nothing ran at all and no error surfaced. Rather than shrug, go and
      // find out: ask the server for the entry module and report what it
      // actually says. A 404 or an HTML error page served as JS both land
      // here, and both are invisible from the console alone.
      say('js/app.js 一步都没跑起来，正在诊断…  ·  js/app.js never started; probing…');
      fetch('js/app.js', { cache: 'no-store' }).then(function (r) {
        var ct = r.headers.get('content-type') || '(none)';
        if (!r.ok) {
          lock('服务器对 js/app.js 返回 HTTP ' + r.status + '。多半是服务器不是在仓库根目录起的 —— '
            + '请在能看到 index.html 和 js/ 的那一层运行 python3 -m http.server 8899。'
            + '  ·  The server returned HTTP ' + r.status + ' for js/app.js. Start it in the repository root.');
          return;
        }
        if (ct.indexOf('javascript') === -1 && ct.indexOf('text/plain') === -1) {
          lock('js/app.js 被服务器当成 "' + ct + '" 发出来了，浏览器会拒绝把它当模块执行。'
            + '  ·  js/app.js is served as "' + ct + '", so the browser refuses to run it as a module.');
          return;
        }
        why.dataset.locked = '';
        reportGraph('js/app.js 取得到但没跑起来 · js/app.js is reachable but never ran:');
      }).catch(function (err) {
        lock('连 js/app.js 都取不到：' + (err && err.message) + '。本地服务器可能没在跑。'
          + '  ·  Could not even fetch js/app.js: ' + (err && err.message) + '. Is the local server running?');
      });
    }, 4000);
  }());
</script>

<header class="toolbar">
  <div class="brand">
    <span class="logo">◧</span>
    <span class="brand-name" data-i18n="app.title">AI 标注助手</span>
  </div>

  <label class="ctl"><span data-i18n="toolbar.format">格式</span>
    <select id="format-select"></select>
  </label>

  <label class="ctl"><span data-i18n="toolbar.document">文档</span>
    <select id="doc-select"></select>
  </label>

  <div class="spacer"></div>

  <div class="menu-wrap">
    <button class="btn ghost sm" data-menu="menu-import" data-i18n="toolbar.import">导入 ▾</button>
    <div id="menu-import" class="dropdown-menu">
      <button id="btn-local" class="menu-item" data-i18n="menu.localFile">本地文件（.json / .txt / .umr）</button>
      <button id="btn-drive" class="menu-item" data-i18n="menu.drive">Google Drive…</button>
      <div class="menu-sep"></div>
      <div class="menu-label" data-i18n="menu.sampleLabel">测试用：模拟 Drive 导入未标注文件</div>
      <button id="btn-drive-demo-en" class="menu-item" data-i18n="menu.sampleEn">示例文档（英文，未标注）</button>
      <button id="btn-drive-demo-wiki" class="menu-item" data-i18n="menu.sampleWiki">维基百科示例（英文，未标注）</button>
      <button id="btn-drive-demo-zh" class="menu-item" data-i18n="menu.sampleZh">示例文档（中文，未标注）</button>
    </div>
  </div>

  <div class="menu-wrap">
    <button class="btn ghost sm" data-menu="menu-export" data-i18n="toolbar.export">导出 ▾</button>
    <div id="menu-export" class="dropdown-menu">
      <button id="btn-export" class="menu-item" data-i18n="menu.exportDoc">导出标注 JSON</button>
      <button id="btn-proposals" class="menu-item" data-i18n="menu.exportProposals">导出 skill 更新提案</button>
    </div>
  </div>

  <button id="btn-github" class="btn ghost sm">GitHub</button>
  <button id="btn-studio" class="btn ghost sm" data-i18n="toolbar.studio">格式生成器</button>

  <label class="ctl"><span data-i18n="toolbar.mode">模式</span>
    <select id="mode-select">
      <option value="replay" data-i18n="mode.replay">replay（回放 / 演示）</option>
      <option value="live" data-i18n="mode.live">live（真实调用模型）</option>
    </select>
  </label>
  <span id="provider-indicator" class="provider-indicator">replay</span>

  <button id="btn-log" class="btn ghost sm icon-btn" data-i18n-title="log.title" title="运行日志">
    <span data-i18n="toolbar.log">日志</span><span id="log-badge" class="badge"></span>
  </button>
  <button id="btn-lang" class="btn ghost sm" data-i18n="toolbar.lang" data-i18n-title="toolbar.langTitle">English</button>
  <button id="btn-settings" class="btn ghost sm icon-btn" data-i18n-title="toolbar.settings" title="设置">⚙</button>
</header>

<div id="sentence-bar" class="sentence-bar"></div>

<main class="workspace">
  <section class="pane pane-left">
    <div class="pane-head"><span data-i18n="pane.source">原始文件</span> <span class="muted" data-i18n="pane.sourceGloss">source</span></div>
    <div id="pane-source" class="pane-body"></div>
  </section>

  <aside id="legend" class="legend"></aside>

  <section class="pane pane-mid">
    <div class="pane-head"><span data-i18n="pane.annotated">标注后文件</span> <span class="muted" data-i18n="pane.annotatedGloss">annotated</span></div>
    <div id="pane-annotated" class="pane-body"></div>
  </section>

  <section class="pane pane-right">
    <div class="pane-head"><span data-i18n="pane.assistant">AI 标注助手</span> <span class="muted" data-i18n="pane.assistantGloss">skill call</span></div>
    <div id="pane-assistant" class="pane-body"></div>
    <div class="pane-head sub" data-i18n="pane.chat">AI 对话 · rationale 交锋</div>
    <div id="pane-chat" class="pane-chat"></div>
  </section>
</main>

<aside id="log-panel" class="log-panel">
  <div class="log-panel-head">
    <h3 data-i18n="log.title">运行日志</h3>
    <button id="log-panel-close" class="btn sm ghost" data-i18n="common.close">关闭</button>
  </div>
  <div id="log-panel-body" class="log-panel-body"></div>
</aside>

<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
