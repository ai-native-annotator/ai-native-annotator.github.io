<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI 标注助手 · Annotation Workbench</title>
<meta name="description" content="面向 UMR 等结构化标注任务的 AI 协作标注台：连接 Google Drive / GitHub，一步步用 skill 标注，语音输入，多人标注一致性合并。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>◧</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!--
  Visible by default; js/app.js removes it once boot() finishes. If the module
  never loads (opened over file://, a bad path, a syntax error) the page still
  renders this whole static layout and looks like a working app while nothing
  at all is wired up — every button silently does nothing. This banner is what
  turns that into a stated failure. The inline script is deliberately NOT a
  module, so it runs even when module loading is what is broken.
-->
<div id="boot-error" class="boot-error" role="alert">
  <strong>页面没有启动 · The app did not start</strong>
  <span id="boot-error-why"></span>
</div>
<script>
  (function () {
    var why = document.getElementById('boot-error-why');
    if (location.protocol === 'file:') {
      why.textContent = '你是用 file:// 直接打开的 HTML。浏览器会以 CORS 为由拒绝加载 ES 模块，'
        + '所以 js/ 下的代码一行都没跑 —— 界面是静态的，任何按钮（包括语言切换）都不会有反应。'
        + '请在仓库根目录起一个本地服务器：python3 -m http.server 8899，然后访问 http://localhost:8899/'
        + '  ·  Opened over file://, so the browser blocked the ES modules and no script ran. '
        + 'Serve the folder instead: python3 -m http.server 8899 then open http://localhost:8899/';
      return;
    }
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') {
        why.textContent = '加载 ' + (e.target.src || 'js/app.js') + ' 失败。'
          + '  ·  Failed to load ' + (e.target.src || 'js/app.js') + '.';
      }
    }, true);
    setTimeout(function () {
      var box = document.getElementById('boot-error');
      if (box && !why.textContent) {
        why.textContent = 'js/app.js 没有跑完 boot()。请打开浏览器控制台看具体报错。'
          + '  ·  js/app.js did not finish boot(). Open the browser console for the actual error.';
      }
    }, 4000);
  }());
</script>

<header class="toolbar">
  <div class="brand">
    <span class="logo">◧</span>
    <span class="brand-name" data-i18n="app.title">AI 标注助手</span>
  </div>

  <label class="ctl"><span data-i18n="toolbar.format">格式</span>
    <select id="format-select"></select>
  </label>

  <label class="ctl"><span data-i18n="toolbar.document">文档</span>
    <select id="doc-select"></select>
  </label>

  <div class="spacer"></div>

  <div class="menu-wrap">
    <button class="btn ghost sm" data-menu="menu-import" data-i18n="toolbar.import">导入 ▾</button>
    <div id="menu-import" class="dropdown-menu">
      <button id="btn-local" class="menu-item" data-i18n="menu.localFile">本地文件（.json / .txt / .umr）</button>
      <button id="btn-drive" class="menu-item" data-i18n="menu.drive">Google Drive…</button>
      <div class="menu-sep"></div>
      <div class="menu-label" data-i18n="menu.sampleLabel">测试用：模拟 Drive 导入未标注文件</div>
      <button id="btn-drive-demo-en" class="menu-item" data-i18n="menu.sampleEn">示例文档（英文，未标注）</button>
      <button id="btn-drive-demo-wiki" class="menu-item" data-i18n="menu.sampleWiki">维基百科示例（英文，未标注）</button>
      <button id="btn-drive-demo-zh" class="menu-item" data-i18n="menu.sampleZh">示例文档（中文，未标注）</button>
    </div>
  </div>

  <div class="menu-wrap">
    <button class="btn ghost sm" data-menu="menu-export" data-i18n="toolbar.export">导出 ▾</button>
    <div id="menu-export" class="dropdown-menu">
      <button id="btn-export" class="menu-item" data-i18n="menu.exportDoc">导出标注 JSON</button>
      <button id="btn-proposals" class="menu-item" data-i18n="menu.exportProposals">导出 skill 更新提案</button>
    </div>
  </div>

  <button id="btn-github" class="btn ghost sm">GitHub</button>
  <button id="btn-studio" class="btn ghost sm" data-i18n="toolbar.studio">格式生成器</button>

  <label class="ctl"><span data-i18n="toolbar.mode">模式</span>
    <select id="mode-select">
      <option value="replay" data-i18n="mode.replay">replay（回放 / 演示）</option>
      <option value="live" data-i18n="mode.live">live（真实调用模型）</option>
    </select>
  </label>
  <span id="provider-indicator" class="provider-indicator">replay</span>

  <button id="btn-log" class="btn ghost sm icon-btn" data-i18n-title="log.title" title="运行日志">
    <span data-i18n="toolbar.log">日志</span><span id="log-badge" class="badge"></span>
  </button>
  <button id="btn-lang" class="btn ghost sm" data-i18n="toolbar.lang" data-i18n-title="toolbar.langTitle">English</button>
  <button id="btn-settings" class="btn ghost sm icon-btn" data-i18n-title="toolbar.settings" title="设置">⚙</button>
</header>

<div id="sentence-bar" class="sentence-bar"></div>

<main class="workspace">
  <section class="pane pane-left">
    <div class="pane-head"><span data-i18n="pane.source">原始文件</span> <span class="muted" data-i18n="pane.sourceGloss">source</span></div>
    <div id="pane-source" class="pane-body"></div>
  </section>

  <aside id="legend" class="legend"></aside>

  <section class="pane pane-mid">
    <div class="pane-head"><span data-i18n="pane.annotated">标注后文件</span> <span class="muted" data-i18n="pane.annotatedGloss">annotated</span></div>
    <div id="pane-annotated" class="pane-body"></div>
  </section>

  <section class="pane pane-right">
    <div class="pane-head"><span data-i18n="pane.assistant">AI 标注助手</span> <span class="muted" data-i18n="pane.assistantGloss">skill call</span></div>
    <div id="pane-assistant" class="pane-body"></div>
    <div class="pane-head sub" data-i18n="pane.chat">AI 对话 · rationale 交锋</div>
    <div id="pane-chat" class="pane-chat"></div>
  </section>
</main>

<aside id="log-panel" class="log-panel">
  <div class="log-panel-head">
    <h3 data-i18n="log.title">运行日志</h3>
    <button id="log-panel-close" class="btn sm ghost" data-i18n="common.close">关闭</button>
  </div>
  <div id="log-panel-body" class="log-panel-body"></div>
</aside>

<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
