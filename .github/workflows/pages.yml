# Deploy the annotation workbench to GitHub Pages.
#
# ONE-TIME SETUP, still required by a human with repo admin:
#   Settings -> Pages -> Source = "GitHub Actions"
# Until that is done this workflow can run but the site stays 404.
#
# The site is published from the repository's default branch,
# `claude/ai-annotator-web-full-uzmpyp`, and `main` carries the same history.
# Only the default branch may deploy to the github-pages environment; a run on
# `main` waits in the `pages` concurrency queue, fails, and holds up the real
# deploy, so it is not triggered on `main`.
# The site as it was before the SkillParse front page is kept as `obsolete`.
#
# The site is static (no build step) — this just uploads the repo root.

name: Deploy to Pages

on:
  push:
    branches: [claude/ai-annotator-web-full-uzmpyp]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
