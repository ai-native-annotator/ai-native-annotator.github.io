# Deploy the annotation workbench to GitHub Pages.
#
# ONE-TIME SETUP, still required by a human with repo admin:
#   Settings -> Pages -> Source = "GitHub Actions"
# Until that is done this workflow can run but the site stays 404 — that is
# exactly what happened here: it was written for `main`, this repo's default
# branch is `claude/ai-annotator-web-full-uzmpyp`, so it never even fired.
#
# It now follows the default branch instead of a hard-coded name, so renaming
# or merging elsewhere does not silently stop deploying.
#
# The site is static (no build step) — this just uploads the repo root.

name: Deploy to Pages

on:
  push:
    branches: [main, master, claude/ai-annotator-web-full-uzmpyp]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
