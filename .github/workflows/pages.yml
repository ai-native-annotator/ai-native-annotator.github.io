# Deploy the annotation workbench to GitHub Pages.
#
# ONE-TIME SETUP, still required by a human with repo admin:
#   Settings -> Pages -> Source = "GitHub Actions"
# Until that is done this workflow can run but the site stays 404.
#
# `main` is the published branch. The earlier default branch,
# `claude/ai-annotator-web-full-uzmpyp`, is kept as `obsolete`.
#
# The site is static (no build step) — this just uploads the repo root.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
