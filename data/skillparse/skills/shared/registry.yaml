# The procedure of every language that has no registry.yaml of its own (Chinese, English): the
# skill.md files in its folder are what differ.
# sent_type is kind: jev (with jevlib.py and prompt_loader.py); every other model
# skill is kind: agent: its skill.md, answered by the model picked in the toolbar. A file that is
# not in this folder is skills/shared's (data/skillparse/README.md).
# There is no coverage, antecedent (outside stays in the step) or reentrancy wave (nodes with the
# same span and concept, and each outside participant with the node it names, are merged when the
# .umr is written). discourse's relation is any string (not checked against a list).
# jevlib.py cuts a Chinese piece only at punctuation (no jieba).
# 语法说明见 skills/REGISTRY.md。
#
# 两波，按顺序跑（web：没有 reentrancy 这一波；写 .umr 时合并：span 和概念都一样的节点是同一个，
# outside 里的每个参与者按它写的节点编号（node）接到那个节点上，见 sp_bridge.py 的 RegistryEngine.merges）：
#   sentence    每句一个 episode，从 sent_type 开始逐层往下切，建出这句的树
#   document    每句一个 episode，看这句和它前五句的树，产出这句的文档级图
#
# sentence 这一波里的流向（见文件末尾 dispatcher）：
#   sent_type ─┬─ discourse ──┬─ 有关系：每块 → sent_type
#              │              └─ 没关系：整段 → predicate
#              ├─ predicate ──┬─ 每个 open（占位） → sent_type
#              │              └─ 每个从句外的参与者：写在 outside 里（写节点编号），写 .umr 时接到那个节点上
#              ├─ np_phrase ──┬─ 每个 open → sent_type
#              │              └─ 每个短语外的参与者：写在 outside 里（如 其同类 的 其）
#              ├─ special_entity ─┬─ 每个 open → sent_type（一般没有）
#              │                  └─ 每个外面的参与者：写在 outside 里（一般没有）
#              └─ stop（叶子，自带一个小图）── web：sent_type 不写 outside
#
# 产出图的 skill（predicate、np_phrase、special_entity，以及 stop 时的 sent_type）都写一个
# 图片段 graph = {nodes, edges, attrs}，还没展开的部分写成占位变量，列在 open 里。
# 子节点的 edge 就是它要填的占位变量；output handler 把片段拼成整句的图。
# 写在这一块外面的参与者列在 outside 里。predicate 的 outside 按角色挂在谓词上；
# np_phrase、special_entity、stop 的 outside 各有一个变量，片段的边可以指向它
# （所以能挂在片段里的任何节点上），合并后填成那个已有的节点。
#
# 往下传的是这一块的原文 text 和它的 span。span 是 [第一个, 最后一个] token 的编号，
# 从 1 开始、两头都包含，编号就是 token_sent 里每个 token 前面的数字（整句的编号）。


waves:

  - name: generate                      # web：wave 0，一次生成整句的图和文档级标注，规则检查后转成后面两波的步骤
    start: umr_generate
    parallel: 1                         # 每句要看前面几句生成的图：按顺序
    init_input:
      for_each:
        sentence: annotation.sents
      context:
        index: sentence.index
        sent: sentence.text
        token_sent: sentence.numbered_tokens
        lang: annotation.lang
      input:
        before:                         # 前五句生成的图和文档级标注（这一波确认过的）
          window: worktree.generate
          range: [-5, 0]
          pick: generated

  - name: sentence
    start: sent_type
    parallel: 20                        # 同时跑几个 episode；写 1 就是串行
    max_depth: 12
    max_nodes: 200
    init_input:
      for_each:
        sentence: annotation.sents      # 每句一个 episode
      context:                          # 这个 episode 里每个 skill 都自动拿到
        sent: sentence.text
        token_sent: sentence.numbered_tokens   # [[1, "Edmund"], [2, "Pope"], ...]
        lang: annotation.lang
      input:                            # 只给 start 那个 skill
        text: sentence.text             # 根节点处理整句
        span: sentence.span

  - name: document
    start: [modal, temporal, coref]   # web：三步并列（步骤 1、2、3），互不依赖：modal 是规则，temporal、coref 是模型
    parallel: 20                        # 只读前面几波的结果，各句可以同时跑
    init_input:
      for_each:                         # 每句一个 episode
        sentence: annotation.sents
      context:
        lang: annotation.lang
      input:
        sentences:                      # web：前五句 + 这一句，这一句在最后；开头几句不足五句就少几项
          window: worktree.sentence     # 每句是 sentence 这一波的一张节点表（句号、原文、每个节点的编号、
          range: [-5, 1]                # full span 原文、概念、事件或实体、哪个 skill 产出），不是整棵树；
          pick: table                   # 见 sp_bridge.py 的 RegistryEngine._table


skills:

  # ---- wave 0（web）----

  umr_generate:                 # 整句的 UMR 图（penman）、对齐、文档级标注，一次写出；模型默认 GPT-6.1 Sol / Opus 5.5
    path: umr_generate
    input:
      before: list[dict]
    emit:
      graph: str                # 句级图，penman
      alignment: dict           # 变量 → [首, 尾]（Tokens 的编号）
      document: str             # 文档级标注：(s<N>s0 / sentence :temporal (...) :modal (...) :coref (...))
    store: [graph, alignment, document]

  convert:                      # 规则（convert/convert.py）：检查 penman、对齐和文档级标注；网页把它载入 sentence、document 两波
    path: convert
    kind: rule
    input:
      graph: str
      alignment: dict
      document: str
    emit:
      graph: str
      alignment: dict
      document: str
      problems: list[str]
    store: [graph, alignment, document]

  # ---- sentence 这一波 ----

  # 判断这一块是什么类型；是 stop（叶子）时顺便给出它的小图。
  sent_type:
    path: sent_type
    kind: jev
    input:
      text: str                 # 这一块的原文
      span: list[int]
    emit:
      type: [discourse, predicate, np_phrase, special_entity, stop]
      graph: dict               # type 是 stop 时：这个叶子的图片段（一个或几个节点）；其他 type 写 {}
    store: [type, graph]              # web：sent_type 不写 outside

  discourse:
    path: discourse
    input:
      text: str                 # 这一块的原文
      span: list[int]
    emit:
      relation: str             # web: 不按列表检查取值（skill.md 说明各种关系）；不是并列关系时写 "none"
      parts: list[dict]         # 每块 {text, span, role}，role 如 op1 / op2 / ARG1 / ARG2
    store: [relation]

  # 一个从句：查 PropBank 定义项，按框架直接写出这个事件的图片段；论元写成占位，交给下游。
  predicate:                    # 用通用工具 propbank_lookup（skills/tools/）
    path: predicate
    input:
      text: str                 # 这一块的原文
      span: list[int]
    emit:
      graph: dict               # 图片段，第一个节点是谓词
      open: list[dict]          # 占位：每个 {var, text, span}，交给 sent_type
      outside: list[dict]       # 从句之外的参与者，每个 {text, span, role}
      alignment: list[int]      # 谓词本身的 span
      frame: dict               # 选定义项的 PropBank 框架 {roleset, roles}；抽象概念或查不到时 {}
      # web：aspect、modstr 不单列，是 graph.attrs 里事件节点的属性：[e, "aspect", …]、[e, "modstr", …]
      polarity: [positive, negative]
    store: [graph, open, alignment, frame, polarity]   # polarity 写成谓词的属性

  np_phrase:                    # 也用 propbank_lookup（施事名词、名物化事件要查义项）
    path: np_phrase
    input:
      text: str                 # 这一块的原文
      span: list[int]
    emit:
      graph: dict               # 图片段，第一个节点是中心词
      open: list[dict]          # 占位：修饰语，每个 {var, text, span}
      outside: list[dict]       # 写在这个短语外面的参与者（如 其同类 的 其 指的人），每个 {var, text, span, at}
      alignment: list[int]      # 中心词的 span
    store: [graph, open, outside, alignment]

  special_entity:               # 命名实体、时间表达、数量、序数
    path: special_entity
    input:
      text: str                 # 这一块的原文
      span: list[int]
    emit:
      graph: dict               # 图片段：名字、日期、数量的固定结构
      open: list[dict]          # 一般为空；里面有要另外标注的部分时才用
      outside: list[dict]       # 一般为空；写在外面的参与者，每个 {var, text, span}
      alignment: list[int]
    store: [graph, open, outside, alignment]

  # ---- 整篇的一波 ----

  # web：文档级拆成三步。每步的 relations 都是 {group, source, relation, target}，source、target 用
  # 节点编号 "<句号>:<节点编号>[/变量]"（如 "3:0.1"），或常量 author、document-creation-time；
  # output handler 把三步的合在一起，再翻译成 .umr 的变量名
  modal:                        # 规则（modal/modal.py），不调模型：转述的 conceiver、名词里的事件
    path: modal
    kind: rule
    input:
      sentences: list[dict]           # 每句一张节点表（见上面 document 这一波）
    emit:
      relations: list[dict]
    store: [relations]

  temporal:                     # 时间依存
    path: temporal
    input:
      sentences: list[dict]
    emit:
      relations: list[dict]
    store: [relations]

  coref:                        # 共指
    path: coref
    input:
      sentences: list[dict]
    emit:
      relations: list[dict]
    store: [relations]


# 每个 skill 跑完之后起哪些新 skill。
# 每条规则都会检查，命中的都执行（不是 if/elif）。
dispatcher:

  # web：wave 0 生成之后，规则检查并转换
  umr_generate:
    - {run: convert, input: {graph: umr_generate_emit.graph, alignment: umr_generate_emit.alignment, document: umr_generate_emit.document}}

  # 按类型分发；text 和 span 原样往下传。stop：没有后续
  sent_type:
    - {when: {sent_type_emit.type: discourse},      run: discourse,      input: {text: text, span: span}}
    - {when: {sent_type_emit.type: predicate},      run: predicate,      input: {text: text, span: span}}
    - {when: {sent_type_emit.type: np_phrase},      run: np_phrase,      input: {text: text, span: span}}
    - {when: {sent_type_emit.type: special_entity}, run: special_entity, input: {text: text, span: span}}

  discourse:
    # 有篇章关系：每一块交给 sent_type 重新判断类型
    - when: {discourse_emit.relation: {not: "none"}}
      each: {part: discourse_emit.parts}
      run: sent_type
      input: {text: part.text, span: part.span}
      edge: part.role
    # 没有：整段交给 predicate
    - when: {discourse_emit.relation: "none"}
      run: predicate
      input: {text: text, span: span}

  predicate:
    # 每个占位交给 sent_type；edge 是占位变量，output handler 用子节点填它
    - each: {hole: predicate_emit.open}
      run: sent_type
      input: {text: hole.text, span: hole.span}
      edge: hole.var

  np_phrase:
    - each: {hole: np_phrase_emit.open}
      run: sent_type
      input: {text: hole.text, span: hole.span}
      edge: hole.var

  special_entity:
    - each: {hole: special_entity_emit.open}
      run: sent_type
      input: {text: hole.text, span: hole.span}
      edge: hole.var

  # web：document 这一波的 modal、temporal、coref 是三个并列的起点（见 waves），没有后续

# ---- 右栏（web）：不属于任何一波；右栏的每一栏都按这里的配置 ----
# 每一项是一个 skill（path、kind、input、emit，写法和 skills 一样），另外可以有：
#   title   右栏这一栏的标题（{zh: …, en: …}，按界面语言显示；也可以只写一个）
#   role    用哪个模型角色（顶部的模型设置）
#   review  人审核之后执行的 skill  modes   反思的几种方式
user_panel:

  local_change:                 # 「改这一句的图」：模型读这一句的树和变量表，按人的评论提出一组改动；人审核后交给 review
    title: {zh: 改这一句的图, en: Change this sentence's graph}
    kind: agent
    path: local_change
    role: generate              # 整句的判断：用 wave 0 那个模型（默认 GPT-6.1 Sol / Opus 5.5）
    input:                      # 上下文（按 skill.md 的 ## Input 填）；可选的值：sentence, tokens, tree, variables, graph, comment, lang, index
      sentence: str             # 句子
      tokens: str               # 分好的句子，每个 token 带编号
      tree: str                 # 在建或完整的步骤树：每一步的编号、skill、那段话、输出（节点用 UMR 变量）
      variables: str            # 当前 penman 图的变量 ↔ 步骤（node）对照表
      comment: str              # 人的评论
    emit:
      changes: list[dict]       # 改动，按顺序：add_node / delete_node / rename_node / add_relation / delete_relation / set_attribute
      summary: str              # 改了什么、为什么
    review: apply_change        # 人在 penman 和图上看过、勾选之后，执行改动的 skill

  apply_change:                 # 规则（apply_change/apply_change.py）：把勾选的改动用到这一句的图上；网页再把新图拆回步骤（到 stop 为止）
    title: {zh: 执行改动, en: Apply the changes}
    kind: rule
    path: apply_change
    input:
      graph: str                # 这一句现在的图（penman；谓词的 modstr 写成 :modstr）
      alignment: dict           # 变量 → [首, 尾]
      changes: list[dict]
      index: int                # 句号：新节点的变量名 s<句号>…
    emit:
      graph: str
      alignment: dict
      applied: list[dict]       # 每条改动：ok、why、新节点的变量名
      marks: dict               # 新增、删除、修改了哪些节点、关系、属性（给 penman 和图上色）
      problems: list[str]

  reflect:                      # 「反思这一步」：对选中的那一步，找 skill 的问题、提修改（system 是 reflect/skill.md）
    title: {zh: 反思这一步, en: Reflect on this step}
    kind: agent
    path: reflect
    role: reflect
    modes: [edit, corrected, told]
    emit:
      diagnosis: str
      layer: str
      edits: list[dict]
