schema_version: 1
tables:
  TYPES:
    discourse: |-
      Two or more full clauses joined as equals: coordination (X，并且Y; X，但是Y; X或者Y; X，然后Y; X and Y; X, but Y). The clauses may share one subject written only once: a subject with two or more verb phrases, each with its own main verb, the later ones after a comma and joined by 并/而/也/还 or by nothing (X关闭了工厂，并调走工人); a comma clause that goes on to list who or what was involved (…，包括A、B和C) is a clause of its own too. A main clause with a subordinate clause (因为, 如果, 当……时, 为了, 以便, 从而, a relative clause ending in 的) is NOT this: it is predicate. Neither is one verb of saying, reporting, thinking, suspecting or showing (说, 称, 表示, 声称, 认为, 怀疑, 显示) followed by what is said, thought or shown, even when that is several clauses with commas between them: the whole piece is predicate. Nor a clause after a comma that only says where or what the last noun before it is (放进盒子，藏在柜底, about the box): predicate. It IS discourse when the speaker does something else after the comma, a second action with its own verb (X称A，并主持了B).
    predicate: |-
      One event or state: a clause or verb phrase with its participants, a relative clause given alone (……的 with a verb in it), a predicate adjective (天很冷), an event noun used as an event with its own participants. A whole simple sentence with one main verb (and its subordinate clauses) is predicate, and so is a sentence whose main verb is a verb of saying, reporting, thinking, suspecting or showing whose content runs over several comma clauses (某人表示A，B，C; 官方怀疑A，B，C): that verb heads everything after it. Also a subject followed directly by its verb or adjective, with no 的 between them and no 是/很 needed (房租昂贵, 工人罢工, 收入减少, 计划可行), and 最/更/很 + adjective or verb with no noun after it (最受欢迎, 更加便宜). A single verb or stative adjective alone in the piece is predicate too when it names an event or state here and its participants are outside the piece (the verb after 开始/继续/拒绝, the verb of a 为了 clause, the verb of a relative clause), and so is a verb with a reflexive object (爱自己, 怪自己). Also a verb followed by its object, even when the piece ends in a noun (保护森林, 资助那个“团体”); a piece starting with a copula 是/还是/不是 + a noun phrase (还是队员, 是该校学生): a role or identity; 跟/和/与 X 有 + an event noun (与X有合作); and a noun + verb compound naming the act done to the noun (火灾预防, 价格控制), unless a noun follows it (火灾预防 + 部门 is np_phrase) or it names a field of study or work (企业管理 as a subject is np_phrase). NOT predicate: a piece whose only verb-like words are grammar (an aspect marker 正/正在, the 时 of X时, a connective 若/如果, a preposition or frame 透过/通过/对X而言); judge it by what is left: a plain noun left over is stop or np_phrase, an event noun is predicate.
    np_phrase: |-
      A noun phrase that needs more than one node: a noun with modifiers (adjective, noun modifier, possessor X的N, relative clause + noun), a number or demonstrative with a classifier (三本书, 这种手机, 两张), coordinated nouns (A和B), or a single noun naming a person by what they do or the role they hold (救援人员, 袭击者, 总统, 官员). Also a compound whose first part modifies its head, even written as one word (体育新闻 = 新闻 + 体育, 红帽子, 网络安全, 金属箱子), a noun made of a verb + 者 (幸存者, 投资者), and a time word followed by a smaller time word (明天下午). A place or country name before an ordinary noun is a modifier, not part of a name: 德国当局, 杭州东部, 韩国电视台, 东京枪击案, 中方 are np_phrase; so is a description made of ordinary words for one particular committee, centre or plan (X应急委员会, 救援中心), with quotes or without. A noun phrase ENDS in its noun head, every modifier before it: a piece that ends in a verb or adjective saying something about the noun before it is NOT np_phrase but predicate (价格昂贵), and so is a verb followed by its object (保护森林) or a piece starting with 是/还是 (是协会会员), while 最受欢迎的X stays np_phrase. A name with a title, job or state before it (已故作家X, 前市长X) is np_phrase. BUT a quoted title of a work is special_entity, even with 一篇 / 两本 before it or its type word after it (“X”巡回演出, 《X》杂志).
    special_entity: |-
      A proper name (person, place, country, a facility or organization called by its own name), a date or clock time with numbers (2019年3月8日, 9点15分), a quantity with a unit (20年, 3499美元; 5000人 is NOT: a number of people is np_phrase), a percentage, or an ordinal (第三). The whole piece must be the name. A name stays whole when its last word belongs to it: a club, team or university (X足球俱乐部, X大学), a named match or edition of a competition (X杯决赛, X联赛), a show or tour named with its quoted or English title (“X”巡回演唱会, 慈善晚会 + an English title), a website, platform or brand (often Latin letters inside Chinese, like Snapchat). Also the title of a work in quotes or book marks (an article, report, book, programme or song: 一篇「X」, 《海边的故事》); a number + classifier before the title (一篇, 两本) belongs to it, and the words inside the title are never analysed. Only the name or title itself is special_entity: an ordinary noun after a place name (政府, 当局, 警察, 方, 南部, 电视台, X案) makes the piece np_phrase; quotes around ordinary words do not make a name; a single ordinary noun for a place or body (教堂, 车站) is stop; a name with a title, descriptor or state before it (已故作家X, 前市长X) is np_phrase; and a name followed by a verb and what it says or does (X表示……, X宣布……) is predicate.
    stop: |-
      One concept with nothing inside it: a single plain noun, pronoun, adjective, adverb or time word (尾声, 他, 今天, 当地, 混乱), or an ordinary noun for a place or body (教堂, 车站). Length is not structure: a long word with no modifier is still stop. BUT a compound whose first part modifies its head (体育新闻, 红帽子) or a verb + 者 noun (幸存者) is np_phrase, even written as one word. An adjective or noun that only modifies the noun after it (黑色 in 黑色外套, 公共 in 公共汽车, 冠军 in 冠军奖杯) is stop, even if it can be a predicate elsewhere. Not a verb or an adjective that names an event or a state here, even alone in the piece with its participants outside it (the verb after 开始/继续, the verb of a 为了 clause, a verb + 自己): that is predicate. Not a noun naming an action, happening or feeling used as such (抗议, 谈判, 援助, 担忧 as the object of 表示/提供/表达/进行, after 在…后 or 透过): that is predicate too. Not a proper name, even one word (a person, a place, a Latin-letter brand): special_entity.
  USES:
    event: |-
      An action or happening talked about as such: a verb, the verb of a relative clause or of a purpose clause, the verb after 开始/继续/拒绝, or a noun that names an act wherever it stands: the object of a light or communication verb (提供援助, 进行谈判, 发表演讲, 表达支持, the 调查 in 拒绝调查), after a preposition or inside 在…后/前/中 (在讨论后, 透过谈判), the purpose of 预定/准备/用于, the act inside an agent noun (the 投资 in 投资者), or a verb before a noun saying what that noun does or is for (报警器材, 援助资金, 训练场地). A noun for an announcement, plan, attack, criticism, rescue or greeting is the act, not a document or object.
    state: |-
      A state or feeling said of something: the predicate of its clause (the 危险 in 路很危险, the 健康 in 他很健康), or a feeling or attitude named as a noun after 表示/感到/表达/引起 (表示担忧, 感到失望).
    manner: |-
      An adverb or adverbial saying how, how long, how much, or that something still goes on: often before 地 or right before a verb (悄悄地, 认真, 临时, 彻底, 仍旧, 集体). NOT an event, even if the word can be a verb elsewhere.
    attribute: |-
      A word before a noun (directly or with 的) that only says what kind of thing that noun is, what it is about or what it comes from, with no participants of its own here: an adjective (黑色 in 黑色外套, 简陋 in 简陋的房子), a noun (公共 in 公共汽车, 冠军 in 冠军奖杯), or an event noun used only to classify (洪水 in 洪水灾害, 地震 in 地震的威力, 选举 in 选举结果). NOT an event or a state, even if the word is a verb or adjective elsewhere. But a verb saying what the noun does or is for (报警器材) is event.
    thing: |-
      A concrete thing, a person, a place, or a notion that is not something happening or felt (寒冷 in 在寒冷中, 消遣 in 为了消遣). NOT an event; but a word that means 'the act of X-ing' and stands as an argument of its own is event.
  inline_options_3:
    'true': one verb's content, or one noun's description, runs past the comma
    'false': clauses or verb phrases joined as equals
instructions:
  UNDER_ONE_VERB: |-
    Does everything after the first comma in `piece` belong under one word before that comma: the content of a verb of saying, reporting, thinking, suspecting or showing (several clauses together being what is said, suspected or shown), or a description of the last noun before the comma (what that thing is or where it is)? Answer no when, after the comma, the same subject does something else with a verb of its own (X称A，并主持了B), or when the clauses are events side by side, each true on its own.
  question_2: |-
    What kind of piece of a UMR graph is `piece` (marked 【】 in `sentence_with_piece_marked`)? Judge the piece as a whole.
  question_3: |-
    How is `piece` used in `sentence_with_piece_marked`? Judge its job in this sentence, not what the word can mean elsewhere.
templates: {}
