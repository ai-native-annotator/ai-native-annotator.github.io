# web-procedures/zh, composed by ai-native-annotator.github.io scripts/sync_skillparse.py:
# experiment/decision-orchestration/umr-zh-frag/versions/R42, with sent_type from experiment/decision-orchestration/umr-zh-v11/versions/V12 (kind: jev, and jevlib.py, prompt_loader.py, event_modifiers.py, event_modifiers.yaml it imports).
# Every other model skill is kind: agent: its skill.md, answered by Haiku.
# Left out on the web: coverage. jevlib.py cuts a Chinese piece only at punctuation (no jieba).
# umr-tree skillset. 语法说明见 skillsets/REGISTRY.md。
#
# 三波，按顺序跑：
#   sentence    每句一个 episode，从 sent_type 开始逐层往下切，建出这句的树
#   reentrancy  每句一个 episode，规则（不调模型）：把这句树里同类型、同 span 的节点合并，
#               并把 antecedent 并到同 span（或中心词同 span）的节点上
#   document    每句一个 episode，看补过重入的这句和它前五句，产出这句的文档级图
#
# sentence 这一波里的流向（见文件末尾 dispatcher）：
#   sent_type ─┬─ discourse ──┬─ 有关系：每块 → sent_type
#              │              └─ 没关系：整段 → predicate
#              ├─ predicate ──┬─ 每个 open（占位） → sent_type
#              │              └─ 每个从句外的参与者 → antecedent（规则，交给 reentrancy 合并）
#              ├─ np_phrase ──┬─ 每个 open → sent_type
#              │              └─ 每个短语外的参与者 → antecedent（如 其同类 的 其）
#              ├─ special_entity ─┬─ 每个 open → sent_type（一般没有）
#              │                  └─ 每个外面的参与者 → antecedent（一般没有）
#              └─ stop（叶子，自带一个小图）── 每个外面的参与者 → antecedent
#
# 产出图的 skill（predicate、np_phrase、special_entity，以及 stop 时的 sent_type）都写一个
# 图片段 graph = {nodes, edges, attrs}，还没展开的部分写成占位变量，列在 open 里。
# 子节点的 edge 就是它要填的占位变量；output handler 把片段拼成整句的图。
# 写在这一块外面的参与者列在 outside 里。predicate 的 outside 按角色挂在谓词上；
# np_phrase、special_entity、stop 的 outside 各有一个变量，片段的边可以指向它
# （所以能挂在片段里的任何节点上），合并后填成那个已有的节点。
#
# 往下传的是这一块的原文 text 和它的 span。span 是 [第一个, 最后一个] token 的编号，
# 从 1 开始、两头都包含，编号就是 token_sent 里每个 token 前面的数字（整句的编号）。


waves:

  - name: sentence
    start: sent_type
    parallel: 20                        # 同时跑几个 episode；写 1 就是串行
    max_depth: 12
    max_nodes: 200
    init_input:
      for_each:
        sentence: annotation.sents      # 每句一个 episode
      context:                          # 这个 episode 里每个 skill 都自动拿到
        sent: sentence.text
        token_sent: sentence.numbered_tokens   # [[1, "Edmund"], [2, "Pope"], ...]
        lang: annotation.lang
      input:                            # 只给 start 那个 skill
        text: sentence.text             # 根节点处理整句
        span: sentence.span

  - name: reentrancy
    start: reentrancy
    init_input:
      for_each:                         # 每句一个 episode；两个列表按位置配对
        sentence: annotation.sents
        tree: worktree.sentence         # 上一波这一句的树
      context:
        sent: sentence.text
        token_sent: sentence.numbered_tokens   # [[1, "Edmund"], [2, "Pope"], ...]
        lang: annotation.lang
      input:
        tree: tree

  - name: document
    start: document
    parallel: 20                        # 只读前面几波的结果，各句可以同时跑
    init_input:
      for_each:                         # 每句一个 episode
        sentence: annotation.sents
      context:
        lang: annotation.lang
      input:
        sents:                          # 前五句 + 这一句，这一句在最后；开头几句不足五句就少几项
          window: annotation.sents
          range: [-5, 1]
        trees:                          # 和 sents 一一对应，reentrancy 补过的树
          window: worktree.reentrancy
          range: [-5, 1]


skills:

  # ---- sentence 这一波 ----

  # 判断这一块是什么类型；是 stop（叶子）时顺便给出它的小图。
  sent_type:
    path: sent_type
    kind: jev                 # web: Jev, from experiment/decision-orchestration/umr-zh-v11/versions/V12
    input:
      text: str                 # 这一块的原文
      span: list[int]
    emit:
      type: [discourse, predicate, np_phrase, special_entity, stop]
      graph: dict               # type 是 stop 时：这个叶子的图片段（一个或几个节点）；其他 type 写 {}
      outside: list[dict]       # type 是 stop 时：这个叶子要的、写在这一块外面的参与者，每个 {var, text, span}；其他 type 写 []
    store: [type, graph, outside]

  discourse:
    path: discourse
    input:
      text: str                 # 这一块的原文
      span: list[int]
    emit:
      # 篇章关系（UMR 指南 3-1-6）；不是并列关系时写 "none"，整段交给 predicate
      relation: ["none", "and", "or", "inclusive-disj", "exclusive-disj", "and-but", "consecutive",
                 "additive", "and-unexpected", "and-contrast", "but-91", "contrast-91",
                 "unexpected-co-occurrence-91", "have-concession-91", "have-condition-91",
                 "have-cause-91", "have-purpose-91"]
      parts: list[dict]         # 每块 {text, span, role}，role 如 op1 / op2 / ARG1 / ARG2
    store: [relation]

  # 一个从句：查 PropBank 定义项，按框架直接写出这个事件的图片段；论元写成占位，交给下游。
  predicate:                    # 自带 propbank_lookup
    path: predicate
    input:
      text: str                 # 这一块的原文
      span: list[int]
    emit:
      graph: dict               # 图片段，第一个节点是谓词
      open: list[dict]          # 占位：每个 {var, text, span}，交给 sent_type
      outside: list[dict]       # 从句之外的参与者，每个 {text, span, role}
      alignment: list[int]      # 谓词本身的 span
      frame: dict               # 选定义项的 PropBank 框架 {roleset, roles}；抽象概念或查不到时 {}
      aspect: ["none", "habitual", "generic", "imperfective", "state", "reversible-state",
               "irreversible-state", "inherent-state", "point-state", "process", "atelic-process",
               "perfective", "activity", "undirected-activity", "directed-activity", "iterative",
               "endeavor", "semelfactive", "undirected-endeavor", "directed-endeavor", "performance",
               "incremental-accomplishment", "nonincremental-accomplishment", "directed-achievement",
               "reversible-directed-achievement", "irreversible-directed-achievement", "inceptive"]
      modstr: ["full-affirmative", "partial-affirmative", "neutral-affirmative", "neutral-negative",
               "partial-negative", "full-negative"]
      polarity: [positive, negative]
    store: [graph, open, alignment, frame, aspect, modstr, polarity]   # 后三个写成谓词的属性

  antecedent:                   # 规则：只记下 span，由 reentrancy 并到同 span（或中心词同 span）的节点上
    path: antecedent
    kind: rule
    input:
      text: str
      span: list[int]
    emit:
      span: list[int]
    store: []

  np_phrase:                    # 自带 propbank_lookup（施事名词、名物化事件要查义项）
    path: np_phrase
    input:
      text: str                 # 这一块的原文
      span: list[int]
    emit:
      graph: dict               # 图片段，第一个节点是中心词
      open: list[dict]          # 占位：修饰语，每个 {var, text, span}
      outside: list[dict]       # 写在这个短语外面的参与者（如 其同类 的 其 指的人），每个 {var, text, span, at}
      alignment: list[int]      # 中心词的 span
    store: [graph, open, outside, alignment]

  special_entity:               # 命名实体、时间表达、数量、序数
    path: special_entity
    input:
      text: str                 # 这一块的原文
      span: list[int]
    emit:
      graph: dict               # 图片段：名字、日期、数量的固定结构
      open: list[dict]          # 一般为空；里面有要另外标注的部分时才用
      outside: list[dict]       # 一般为空；写在外面的参与者，每个 {var, text, span}
      alignment: list[int]
    store: [graph, open, outside, alignment]

  # ---- 整篇的两波 ----

  reentrancy:                   # 规则：跑 reentrancy/reentrancy.py 的 run()，不调模型
    path: reentrancy
    kind: rule
    input:
      tree: dict                # 这一句的树
    emit:
      merges: list[dict]        # 每个 {node, into}：两个节点 span 相同，node 并进 into
    store: [merges]

  document:                     # TODO: 时间、模态、共指，一个 skill 还是拆开
    path: document
    input:
      sents: list[dict]
      trees: list[dict]
    emit:
      # 每个 {group, source, relation, target}，group 是 temporal / modal / coref。
      # source、target 用节点编号 "<句号>:<节点 id>"（如 "3:0.2.1"），或常量 author、document-creation-time 等；
      # output handler 再统一翻译成变量名。
      relations: list[dict]
    store: [relations]


# 每个 skill 跑完之后起哪些新 skill。
# 每条规则都会检查，命中的都执行（不是 if/elif）。
dispatcher:

  # 按类型分发；text 和 span 原样往下传。stop：只为 outside 起 antecedent
  sent_type:
    - {when: {sent_type_emit.type: discourse},      run: discourse,      input: {text: text, span: span}}
    - {when: {sent_type_emit.type: predicate},      run: predicate,      input: {text: text, span: span}}
    - {when: {sent_type_emit.type: np_phrase},      run: np_phrase,      input: {text: text, span: span}}
    - {when: {sent_type_emit.type: special_entity}, run: special_entity, input: {text: text, span: span}}
    # 叶子要的、写在外面的参与者：edge 是 outside 的变量，合并后 output handler 用它填这个变量
    - when: {sent_type_emit.type: stop}
      each: {other: sent_type_emit.outside}
      run: antecedent
      input: {text: other.text, span: other.span}
      edge: other.var

  discourse:
    # 有篇章关系：每一块交给 sent_type 重新判断类型
    - when: {discourse_emit.relation: {not: "none"}}
      each: {part: discourse_emit.parts}
      run: sent_type
      input: {text: part.text, span: part.span}
      edge: part.role
    # 没有：整段交给 predicate
    - when: {discourse_emit.relation: "none"}
      run: predicate
      input: {text: text, span: span}

  predicate:
    # 每个占位交给 sent_type；edge 是占位变量，output handler 用子节点填它
    - each: {hole: predicate_emit.open}
      run: sent_type
      input: {text: hole.text, span: hole.span}
      edge: hole.var
    # 从句之外的参与者不再展开，只留一个 antecedent，由 reentrancy 合并
    - each: {other: predicate_emit.outside}
      run: antecedent
      input: {text: other.text, span: other.span}
      edge: other.role

  np_phrase:
    - each: {hole: np_phrase_emit.open}
      run: sent_type
      input: {text: hole.text, span: hole.span}
      edge: hole.var
    # 短语外面的参与者：和 predicate 一样只留一个 antecedent，由 reentrancy 合并；
    # edge 是 outside 的变量（不是角色），合并后 output handler 用它填这个变量
    - each: {other: np_phrase_emit.outside}
      run: antecedent
      input: {text: other.text, span: other.span}
      edge: other.var

  special_entity:
    - each: {hole: special_entity_emit.open}
      run: sent_type
      input: {text: hole.text, span: hole.span}
      edge: hole.var
    - each: {other: special_entity_emit.outside}
      run: antecedent
      input: {text: other.text, span: other.span}
      edge: other.var

  # antecedent / reentrancy / document：没有后续
