schema_version: 1
tables:
  TIME:
    before: |-
      `event` happened before `anchor`. Choose this when (1) `anchor` says, reports, claims, announces, shows, implies, suspects, investigates or tries to determine `event`, and `event` is an act or happening that had already taken place by then (X表示 + someone was hurt; a trace 显示/暗示 + how something was hidden or done; 怀疑/确定 + what someone planned or did), even with no past marker; (2) `event` is the cause of `anchor`: the act that is the subject of a verb of affecting (a remark that angered someone: the remark is before the anger), or the happening in which `anchor` came about (hurt in a fire: the fire is before the hurt); (3) a report or story that `anchor` retells; what `anchor` went through (历经, 经过); 曾, 已, 以前, 'had' on `event` itself (已 on `anchor` says nothing about `event`).
    overlap: |-
      `event` and `anchor` share their time: one holds while the other happens. This is the answer whenever no word orders them: what `anchor` acts on, decides, holds, cancels, avoids or keeps up (取消X, 决定X, 避免X, 举办X); what `anchor` asks for or orders; the state named as the object of a causative `anchor` (引起X, 让X, 使X); a STATE that `anchor` says, shows, sees or learns (X说 + 'is', learning that someone is safe); the means or purpose carried out by doing `anchor` (以X表达); an event that only describes a participant of `anchor` inside a noun phrase (所V的N, V的N) unless it is marked as earlier; a ...时 or 在...的同时 clause; two acts of one operation or occasion joined by 并, 且, 还, 和 or a comma, even when one is told first. Logical order (deciding before doing, causing before resulting) is not time order. When unsure, choose this.
    after: |-
      `event` happened after `anchor`. Choose this when a word says so (然后, 后来, 随后, 之后, ...后, 再, 接着, 'then', 'later'); when `event` is a separate happening that results from `anchor` and `anchor` is the cause itself (the deaths, injuries or damage after an explosion or a crash, each of several results listed after 致使, 导致, 造成); a feeling, reply or protest that reacts to `anchor`; a separate plan for a later time (将, 会); a purpose reached only later (为了 + a later goal).
  DCT_TIME:
    before: |-
      `event` already happened or held when the text was written. Choose this for everything the text narrates or reports about the past, even when Chinese uses no past marker: what a publication or a person did, contained, was like or was called; what someone said, claimed, quoted or reported; how something was judged; states of a thing that has stopped or no longer exists.
    overlap: |-
      `event` still holds at the time of writing. Only when the text marks it as current (目前, 现在, 仍, 至今, 依然, 'still', 'now') or states a general truth that is plainly still true.
    after: '`event` is still to come at the time of writing (将, 会, 即将, ''will'').'
  CLAIMED:
    'true': the conceiver's own claim, judgment or allegation, not vouched for by the writer
    'false': |-
      an announced decision, plan or offer of the conceiver, a plain fact the writer relays, or the act of saying itself
  SAME_ENTITY:
    'true': both point to one particular individual
    'false': |-
      one is generic, a kind, a description, a part, a set, another time's value, or the two are only similar
  SAME_EVENT:
    'true': one occurrence told twice
    'false': different acts, even if they share a participant or a topic
  inline_options_6:
    'true': a happening with a time of its own
    'false': a person, thing, place, organization, text or idea
instructions:
  DCT_ANCHOR: the time the text was written
  VIEW_Q: |-
    In `current_sentence`, whose view presents `event`? Answer an entity X only if `event` is part of the CONTENT of what X says, claims, reports or quotes: it sits inside a clause introduced by X说, X称, X声称, X表示, X宣称, 据X(所言, 报导), X引用报导, and X is the one who says it. Answer author in every other case: (a) the verb of saying, reporting, quoting or being interviewed itself is the writer's own statement; (b) what X does, can do, must do or keeps doing is the writer's statement, not X's view; (c) a headline, title, photo, article, device or satellite never holds a view, nor does a news item, message, rumour, source of news, report, statement or piece of intelligence (消息, 报道, 情报, 声明): answer author; (d) when X reports that Y did something, choose X (the one who says), never Y (the one who acted).
  VIEW_AUTHOR: |-
    the writer asserts it directly: every verb of saying or reporting itself, and every action, ability or state of a participant
  CLAIMED_Q: |-
    In `current_sentence`, is `event` `conceiver`'s own claim, opinion, judgment or allegation: something `conceiver` asserts, judges, alleges or is said or rumoured to hold (称, 声称, 宣称, 认为, 据传, 指, 据X报导, X引用报导), without the writer vouching for it? Answer no when `event` is what `conceiver` decides, plans, promises, offers or announces it will do (宣布, 声明, 决定, 表示愿意 + its own coming action); when `conceiver` tells, recalls or reports a plain fact (告诉, 回忆); when `event` is the act of saying itself; when `conceiver` is not a person or an organization.
  COREF_ENTITY_Q: |-
    Is `mention` of `current_sentence` the very same particular thing as one mentioned in an earlier sentence (a pronoun's antecedent, a repeated or shortened name, 该X, 此X or 'the X' pointing back)? If it is mentioned several times earlier, pick its most recent mention. Answer `new` for: a related thing (its part or component, its end, its place, a member, the set it belongs to); a noun used in a general or kind sense (news in general, content in general, a source of news); a noun used as a modifier or inside a name or title; what something is called, judged to be or becomes (in 'X is called Y' or 'X is Y', Y is a description, not a mention); the same kind of measure or amount at another time or place; a word inside a fixed expression that refers to nothing; an act rather than a thing (a report is not the text it produces).
  COREF_EVENT_Q: |-
    Does `mention` of `current_sentence` tell again the very same single occurrence that an earlier sentence already told: the same act by the same participants at the same time, only described again (the verb repeated, a synonym, a shorter form, or a noun naming that act)? A different act that involves the same thing is `new`: building a bridge vs crossing it, writing a letter vs reading or copying it, publishing a story vs what the story says, taking a picture vs showing it, one finding vs another finding on another occasion, a state vs an act. If in doubt, answer `new`.
  SAME_ENTITY_Q: |-
    Do `first` and `second` refer to one and the same particular person, thing or group (the number in brackets is the sentence in `sentences`)? Answer yes when `second` is a shortened or pointing-back way of naming `first`: a demonstrative + head noun (该X, 此X, 这个X, 'the X', 'this X'), a pronoun (它, 他们, 'they') standing for an organization or publication, a repeated or shortened name. Answer no for a part, a member, a place, a result, the set something belongs to, a general or kind use of a noun, a description of what something is called or is, the same kind of amount at another time, or another thing of the same kind.
  SAME_EVENT_Q: |-
    Are `first` and `second` one and the same occurrence (same act, same doer, same time) told twice, and not two different acts that concern the same thing, or two acts of the same kind? The number in brackets is the sentence in `sentences`.
  question_9: |-
    Do `first` and `second` name an occurrence: something that happens or is held at a particular time (a concert, show, match, game, race, attack, explosion, incident, accident, ceremony, meeting, war), rather than a person, group, object, place, document, text or abstract idea? The number in brackets is the sentence in `sentences`.
  temporal_question_base: In `current_sentence`, how is the time of `event` related to the time of `anchor`?
  temporal_question_context: |2-
     Read `sentences` for context: if an earlier sentence says the thing has ended or stopped, what is told about it is in the past.
templates: {}
