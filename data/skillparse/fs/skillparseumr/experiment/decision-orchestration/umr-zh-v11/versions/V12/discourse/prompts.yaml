schema_version: 1
tables:
  RELATIONS:
    none: |-
      NOT a coordination: one event only. A single clause, possibly with a long object or a relative clause of one noun; a main clause with a clause of time, condition or purpose that only sets the scene (当……时, 在……时, 如果, 为了); a reported clause right after a speech verb (X说Y, X宣布Y, X称Y); a subject or topic noun phrase followed by a comma and then its own predicate. NOT none when, after a comma, a second verb starts a new statement, whether with the same subject (他买了书，还读了两遍) or with a new one (该X…, 其中…, 许多Y也…). Never none when the piece holds two or more sentences ended by 。, ！ or ？.
    and: |-
      plain addition of clauses of equal status: 并且, 而且, 不但……而且, 同时, 也; clauses with DIFFERENT subjects placed side by side with a comma and no time word (A did X，B did Y); clauses sharing one subject joined by 还, 甚至, 也 or 并 when the actions are not ordered in time (states or activities that overlap, several facts about the same agent); two results of one event listed with commas; a second claim about the same subject (X…，表明/显示…); a clause followed by a comment on it (其中…); the sentences of one quotation or report, separated by 。！？ (one flat and, each sentence its own part). Each clause is its own part; the first clause is not the head of the others. If the clauses are clearly ordered in time, see consecutive.
    consecutive: |-
      distinct events that happen one after another: (a) the later clause has an explicit later-time word (然后, 随后, 接着, 之后, 在X后, 第二天, 次年), even when the clauses are joined by 并, 且 or 和; or (b) ONE agent does two or more different actions in turn, in comma-joined clauses with no connective (他打开门，走进房间; 店主报了警，关上了店门). Not for states or activities that hold at the same time, and not for clauses with different subjects side by side (choose and).
    but-91: 'adversative: 但是, 但, 可是, 不过; also 虽然X，但Y'
    contrast-91: |-
      a real opposition between two situations (A is large, whereas B is small; 他喜欢冬天，而她讨厌冬天): 而, 却, whereas. 而 that only carries the story on to a next event or to how other people reacted is NOT contrast: choose and.
    or: '或者, 还是: one or the other'
    have-condition-91: 'the point is a conditional link: 如果X，就Y; 只要X，就Y'
    have-cause-91: |-
      ONLY with an overt causal word: 因为/由于 X，(所以) Y; X，所以/因此/因而/以致(于)/致使/导致 Y; X，于是 Y when Y happens because of X (if Y only follows X in time, choose consecutive). Clauses joined by a bare comma are NEVER have-cause-91, even when one plausibly leads to the other (saw smoke, called for help: consecutive); two results of one event are and; a second claim about the same subject is and.
    have-purpose-91: 'the point is the purpose link: X，以便Y'
    inclusive-disj: Alternatives of which one or more may hold; not an exclusive choice.
    exclusive-disj: Alternatives of which exactly one may hold.
    and-but: Coordinated clauses linked by an adversative but-like relation.
    additive: A clause contributes an additional assertion alongside another assertion.
    and-unexpected: Coordinated assertions whose joint occurrence is presented as unexpected.
    and-contrast: Coordinated assertions contrasted with one another.
    unexpected-co-occurrence-91: A binary relation presenting two events as unexpectedly co-occurring.
    have-concession-91: 'A binary concessive relation: one event holds despite another circumstance.'
instructions:
  question_1: Which discourse relation joins the clauses of `piece` (marked 【】 in `sentence_with_piece_marked`)?
  question_2: |-
    Does `after` start a new clause of its own, linked to `before` as an addition, a sequence, a contrast, a concession, a cause or a result? Answer YES when (a) `after` begins with its own subject followed by its own verb, even if `before` is already a complete clause or has a speech verb such as 宣布/表示/称 earlier on; (b) `after` begins directly with a second verb of the same agent (他们修好了车，开回了家; 她写了信，说…), a speech verb included; (c) `after` is opened by 因为, 以致, 于是, 因而, 但, 还, 甚至, or by 并/并且 between two verb phrases of one subject (the object and any 在…/到… phrase after 并 belong to the second verb). Answer NO when: the word just before this place (说, 表示, 宣布, 认为, a colon) takes `after` as its object or reported content; `after` modifies a noun or is part of the same clause; `before` is only a noun phrase (the subject or topic of the verb in `after`); `before` ends with a phrase that only sets the time or the reason of the next clause (在/当…前/后/时/中, 此前, or 因为/由于 + a noun phrase with no verb of its own outside its modifiers); `after` only says what the action in `before` is for (it reads as 'in order to …', 以 or 为了 could be put in front); or `after` is only an adverb or a connective.
