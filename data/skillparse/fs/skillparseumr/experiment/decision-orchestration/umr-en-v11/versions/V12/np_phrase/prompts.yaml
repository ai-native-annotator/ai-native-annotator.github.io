schema_version: 1
tables:
  SHAPES:
    noun: 'an ordinary noun or a compound word, annotated as written (歌手, 演唱会, 体育场, 产量). THIS IS THE DEFAULT for ordinary
      job, occupation and group nouns, even when counted, possessed or with an organization before them (编辑, 记者, 官员, 大使, 专家,
      学者, 实习生, 孩子, 子公司, 市民, 群众, 嘉宾); for a person noun not built from a verb + 者 / 人 / 员 / 手 (熟客, 会员, 诗人, 职员); for a kinship
      noun with nobody written in the phrase that it is a relation of (父母 or 哥哥 alone); for a title used as the position itself,
      e.g. the object of 当 / 担任 / 成为 (当上经理: 经理); for nouns that mean ''an event, an incident'' but are never verbs (事件, 事故);
      and for a general noun that names a kind of conduct, activity, ceremony, task or money rather than one doing (举动, 典礼,
      项目, 任务, 经费), even with an event word before it (纪念典礼: the head 典礼 is noun). Choose it when unsure between noun and a
      person shape (agent, patient, org-role, rel-role)'
    pronoun: a personal pronoun (他, 他们, 它)
    agent: 'a person named by an activity they do, or by a happening that is theirs alone (getting hurt, dying, getting lost):
      the word ends in 者 / 人 / 员 / 手 and the part before it is a verb of its own (救援者, 袭击者, 发言人, 驾驶员, 创办人, 守门人; also 伤者, 伤员,
      死者, 遇难者, 受害者, 失踪者). Also when the segmentation cut the suffix off as a word of its own (a verb, then 者 / 人员). Not a
      word without such a suffix (市民, 群众, 熟客 are noun), and not a word whose first part is not that verb (诗人, 会员, 职员 are noun)'
    patient: a person an action is done to by someone else, usually 被 + verb + 人 / 者 (被提名人, 被告人, 被捕者). Not the only participant
      of a happening such as getting hurt, dying or getting lost (伤者, 死者 are agent). Not a lexicalised noun such as 专家 or
      学者, and not a nationality or ethnic group + 人 (those are noun)
    org-role: a high office or title held in a country or organization, said of a person (总统, 主席, 部长, 首相, 会长). Not an ordinary
      job noun (编辑, 官员, 大使, 记者 are noun), and not a title used as the position itself (noun)
    rel-role: a kinship or social relation said of a person, with the one it is a relation of written in the phrase (他的母亲,
      某人的朋友, 她的同事, 他的同伙). A kinship noun with nobody written that it is a relation of is noun; not an ordinary noun such as
      孩子 meaning a child, and never an organization (子公司 is noun)
    event: 'a verb or adjective used as a noun for an action, a process, a state, a feeling or a quality, with or without
      written participants, also as a subject or object or after a 的-modifier (城市的毁灭, 他的到来, 爆炸, 袭击, 调查, 支持, 摄影, 城市的美丽). Test:
      the word could be the verb of a clause for the same happening (将X, X了); then it is event even after another noun or
      a classifier, or as the object of a verb such as 取消 / 举行 / 表达 (一场比赛, 取消访问, 表达感谢, 人员损失). Not a word that is only a noun
      and never a clause''s verb (事件, 事故 are noun), not a general noun for a kind of conduct, activity, ceremony or money
      (举动, 典礼, 经费 are noun), and not a descriptive word that only modifies another noun'
    and: 'a coordination of several nouns (A和B, A、B与C), only when a conjunction word or 、 is written between the items: a
      single compound word such as 父母, 夫妻, 兄弟 is noun'
    count: a number and the word it counts, nothing else (23人, 两张, 三起)
  MODS:
    mod: 'a classifying adjective or noun that is not a place, an owner, a subject or a channel, or a demonstrative (危险, 恐怖,
      木头, 这, 那). Also: 当地 ''local'' and 部分 ''some'' (当地商店: 当地; 部分学校: 部分); a noun telling which area or site is meant (港口区域:
      港口); a place name before a head that is itself a place, country or region (亚洲城市: 亚洲; 德国柏林: 德国). NOT a verb and NOT an
      adjective that states something about the head as a predicate (救援小队: 救援; 可疑包裹: 可疑; 运输车辆: 运输; 疑似X的病例: 疑似): those are
      ARG0-of or ARG1-of even with no 的. Adjectives that only say what kind (危险, 恐怖) stay mod'
    poss: 'the owner or holder of the head, with or without 的 (他的车, 公司的资金, 名人住宅: 名人). Not a whole the head is a part, edition
      or contents of (part-of), not what the head shows or is about (topic), not the device or object the head is a component
      of (part-of). Not the subject or object of a verb in a clause before 的 (工人修的路: 工人 goes with 修, ARG1-of). In X在Y的N only
      X is poss (Y is place)'
    quant: a number or quantity word counting the head (三, 500, 多, 一些). Not 部分 (mod), not an age (N岁)
    unit: a classifier after a number or demonstrative (本, 种, 个, 名)
    ord: 'a true ordinal number (第一, 首, first, second, third). NOT next, last, previous, following, other or similar words: those are mod'
    ARG0-of: 'a relative clause, or a verb or descriptive adjective with or without 的, of which the head is the doer or the
      thing described (跑步的人, 会飞的鸟). If the clause has its own subject before its verb, the head is not the doer: use ARG1-of'
    ARG1-of: 'a relative clause or a verb with or without 的, of which the head is the thing affected, made or written (他买的书:
      他 and 买; 修改过的图片). The clause''s own subject belongs here too'
    place: 'a place or country the separate thing named by the head is in, comes from or circulates in (美国歌手: 美国; 曼彻斯特的体育场;
      山区居民; 网上的传言: 网上). Not when the head is a region or part of that place (part-of); not a time (temporal)'
    part-of: 'the whole that the head is a component or portion of: a region of a place (法国南部: 法国; 城市上空: 城市), a section, edition,
      page, title, article or contents of a publication or text (杂志的封面: 杂志; 书的内容: 书; 杂志的电子版: 杂志), a part of a body or object
      (狮子的尾巴: 狮子; 汽车的轮子: 汽车). Choose this rather than poss or place whenever the head is a piece of X'
    topic: 'what the head is about or shows: the subject of a picture, report, sign, figure, policy or message (猫的照片: 猫; 价格数字:
      价格; 经济政策: 经济; 和平的呼声: 和平). Not an owner (poss)'
    medium: 'the channel, medium or language through which the head is carried or published (广播节目: 广播; 网络杂志: 网络; 英文报纸: 英文)'
    temporal: a time or period, including a time noun followed by 上 / 中 / 里 (昨天的会议; 古代中的故事)
    material: a material (木制, 铁质)
    ARG0: the doer of the event the head names
    ARG1: the thing affected by the event the head names
    org: 'the organization of the head''s title (英国的首相: 英国)'
    conj: one of the coordinated items
    head: 'a piece of the same single word as the head, cut off by the word segmentation (a character of a split name or loanword).
      A noun before the head that could stand as a word of its own (电脑 in 电脑游戏, 体育 in 体育新闻) is NOT head: choose its relation
      (topic, medium, mod, ...)'
    none: 'a marker only: 的, 之, punctuation, a linking 是, a preposition (关于, 对于), or an existential 有 before a counted noun'
    part: A component contained by the head; use part-of when the head is itself the component.
    group: A group or set whose members or membership relation are explicitly expressed.
    age: The age of the head entity, distinct from its count or a calendar date.
    configuration: The arrangement of the head entity or its separable components.
    orientation: The orientation of the head entity.
    anchor: The frame of reference of a spatial relation; only for a head expressing such a relation.
    axis: The axis or directed reference line of a spatial relation; only for a head expressing such a relation.
    vocative: A person or entity addressed directly in a vocative construction.
    list-item: An explicitly indexed item in a list structure.
    ARG2-of: A relative clause in which the head fills ARG2 of its predicate. Use only when that predicate frame licenses
      this role.
    ARG3-of: A relative clause in which the head fills ARG3 of its predicate. Use only when that predicate frame licenses
      this role.
    ARG4-of: A relative clause in which the head fills ARG4 of its predicate. Use only when that predicate frame licenses
      this role.
    ARG5-of: A relative clause in which the head fills ARG5 of its predicate. Use only when that predicate frame licenses
      this role.
    ARG6-of: A relative clause in which the head fills ARG6 of its predicate. Use only when that predicate frame licenses
      this role.
  ASPECTS:
    state: a lasting condition, relation or quality, not a change (知识, 存在, 美丽)
    habitual: something done again and again as a regular practice (日常巡逻, 每周的例会)
    activity: an ongoing doing with no built-in end point (研究工作, 锻炼)
    endeavor: an ongoing doing that stopped before any natural end
    performance: one bounded action or event that reaches its end (一次访问, 那场演讲, 一声呼喊)
    process: a dynamic event whose boundedness cannot be decided, e.g. an ongoing operation that is started, stopped or continued
      (生产, 运营)
instructions:
  question_1: What kind of semantic structure should the head of `piece` become? Choose its kind (entity, event, person defined
    by an event, or another listed structure), not a token; the head token is asked separately.
  question_2: Which word is the head noun of the noun phrase `piece`? In Chinese it is usually the last noun; for a coordination,
    the first item.
  question_3: The head of `piece` names an event, or a person defined by an embedded event `stem`. What is the aspect of that
    event in this sentence? Choose the most specific licensed value. Judge the event itself, not the person or the governing
    verb. Do not infer completion from tense or nominal form alone.
  question_4: 'In the noun phrase `piece`, with head `head`, what is the word `word` part of? A word inside a relative clause
    (a stretch before 的 that has a verb: its subject, object, place, time or adverb) takes the clause''s label, ARG0-of or
    ARG1-of, even when it is a person or a place. A word inside a possessor phrase belongs to that modifier. For an event
    head, use its frame roles or event adjuncts. For a person defined by an event, event:* choices describe that inner event;
    ordinary choices describe the person.'
  question_5: Which PropBank sense does the event named by `head` use?
templates:
  option_description_1: 'Of the embedded event, not the person: {value}'
